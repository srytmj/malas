name: Test MALAS

on:
  push:
    branches: [ develop, main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: malas
          POSTGRES_PASSWORD: malas123
          POSTGRES_DB: malas_testing
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U malas"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
      
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.3
          extensions: pdo_pgsql, pgsql, redis, zip, curl, json, mbstring, xml, bcmath
          coverage: none
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      
      - name: Copy environment file
        run: |
          cp .env.ci .env
          php artisan key:generate
      
      - name: Install Composer dependencies
        run: |
          composer install --no-interaction --no-progress --prefer-dist
      
      - name: Install NPM dependencies
        run: |
          npm ci
          npm run build
      
      - name: Run migrations
        run: |
          php artisan migrate --force --seed
      
      - name: Run PHPUnit tests
        run: |
          php artisan test --testsuite=Unit,Feature --stop-on-failure
      
      - name: Run Laravel Pint (code style)
        run: |
          ./vendor/bin/pint --test
        continue-on-error: true  # Tidak gagalkan pipeline, hanya notifikasi
      
      - name: Run PHPStan (static analysis)
        run: |
          ./vendor/bin/phpstan analyse --level=5 app/Modules
        continue-on-error: true
      
      - name: Upload test logs (if failed)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs
          path: storage/logs/