name: Deploy to Production

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to deploy (e.g., v1.0.0)"
        required: true
        type: string

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/01-test.yml
    secrets: inherit

  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: ci
    environment:
      name: production
      url: ${{ secrets.PRODUCTION_URL }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Add host to known_hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.PRODUCTION_HOST }} >> ~/.ssh/known_hosts

      - name: Enable maintenance mode
        run: |
          ssh ${{ secrets.PRODUCTION_USER }}@${{ secrets.PRODUCTION_HOST }} \
            "cd ${{ secrets.PRODUCTION_PATH }} && php artisan down --retry=60"

      - name: Deploy via SSH
        id: deploy
        run: |
          ssh ${{ secrets.PRODUCTION_USER }}@${{ secrets.PRODUCTION_HOST }} << 'ENDSSH'
            set -e
            cd ${{ secrets.PRODUCTION_PATH }}

            git fetch --tags
            git checkout ${{ inputs.tag || github.ref_name }}

            composer install --no-dev --optimize-autoloader
            npm ci && npm run build

            php artisan migrate --force

            php artisan config:cache
            php artisan route:cache
            php artisan view:cache
            php artisan icons:cache
            php artisan filament:cache-components
            php artisan optimize

            php artisan queue:restart
            sudo supervisorctl restart malas-worker:*
          ENDSSH

      - name: Disable maintenance mode
        if: always()
        run: |
          ssh ${{ secrets.PRODUCTION_USER }}@${{ secrets.PRODUCTION_HOST }} \
            "cd ${{ secrets.PRODUCTION_PATH }} && php artisan up"

      - name: Health check
        run: |
          sleep 15
          curl -f ${{ secrets.PRODUCTION_URL }}/up || exit 1
          echo "Health check passed"

      - name: Rollback on failure
        if: failure() && steps.deploy.conclusion == 'failure'
        run: |
          ssh ${{ secrets.PRODUCTION_USER }}@${{ secrets.PRODUCTION_HOST }} << 'ENDSSH'
            set -e
            cd ${{ secrets.PRODUCTION_PATH }}
            php artisan migrate:rollback --step=1 --force
            php artisan up
          ENDSSH
