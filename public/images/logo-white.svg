<svg viewBox="0 0 290 110" xmlns="http://www.w3.org/2000/svg">
  <title>MALAS — Manga Library</title>
  <defs>
    <clipPath id="c">
      <rect x="8" y="8" width="94" height="94" rx="11"/>
    </clipPath>
  </defs>

  <!-- Icon -->
  <rect width="110" height="110" rx="16" fill="#0f0e2a"/>
  <g clip-path="url(#c)">
    <!-- Manga speed lines -->
    <g transform="translate(55,62)" fill="rgba(255,255,255,.055)">
      <polygon points="0,0 -4,-100 4,-100" transform="rotate(0)"/>
      <polygon points="0,0 -4,-100 4,-100" transform="rotate(18)"/>
      <polygon points="0,0 -4,-100 4,-100" transform="rotate(36)"/>
      <polygon points="0,0 -4,-100 4,-100" transform="rotate(54)"/>
      <polygon points="0,0 -4,-100 4,-100" transform="rotate(72)"/>
      <polygon points="0,0 -4,-100 4,-100" transform="rotate(90)"/>
      <polygon points="0,0 -4,-100 4,-100" transform="rotate(108)"/>
      <polygon points="0,0 -4,-100 4,-100" transform="rotate(126)"/>
      <polygon points="0,0 -4,-100 4,-100" transform="rotate(144)"/>
      <polygon points="0,0 -4,-100 4,-100" transform="rotate(162)"/>
      <polygon points="0,0 -4,-100 4,-100" transform="rotate(180)"/>
      <polygon points="0,0 -4,-100 4,-100" transform="rotate(198)"/>
      <polygon points="0,0 -4,-100 4,-100" transform="rotate(216)"/>
      <polygon points="0,0 -4,-100 4,-100" transform="rotate(234)"/>
      <polygon points="0,0 -4,-100 4,-100" transform="rotate(252)"/>
      <polygon points="0,0 -4,-100 4,-100" transform="rotate(270)"/>
      <polygon points="0,0 -4,-100 4,-100" transform="rotate(288)"/>
      <polygon points="0,0 -4,-100 4,-100" transform="rotate(306)"/>
      <polygon points="0,0 -4,-100 4,-100" transform="rotate(324)"/>
      <polygon points="0,0 -4,-100 4,-100" transform="rotate(342)"/>
    </g>

    <!-- Manga volume A (back, crimson) -->
    <g transform="translate(41,90) rotate(-20) translate(-10,-40)">
      <rect width="20" height="40" rx="2" fill="#be123c"/>
      <rect width="4" height="40" rx="2" fill="#881337"/>
      <rect x="4" y="3" width="14" height="6" fill="rgba(255,255,255,.22)"/>
      <line x1="4" y1="13" x2="18" y2="13" stroke="rgba(255,255,255,.15)" stroke-width=".8"/>
      <line x1="4" y1="18" x2="18" y2="18" stroke="rgba(255,255,255,.15)" stroke-width=".8"/>
      <line x1="4" y1="28" x2="18" y2="28" stroke="rgba(255,255,255,.15)" stroke-width=".8"/>
    </g>

    <!-- Manga volume B (middle, amber) -->
    <g transform="translate(52,90) rotate(-7) translate(-10,-43)">
      <rect width="20" height="43" rx="2" fill="#b45309"/>
      <rect width="4" height="43" rx="2" fill="#78350f"/>
      <rect x="4" y="3" width="14" height="7" fill="rgba(255,255,255,.22)"/>
      <line x1="4" y1="14" x2="18" y2="14" stroke="rgba(255,255,255,.15)" stroke-width=".8"/>
      <line x1="4" y1="19" x2="18" y2="19" stroke="rgba(255,255,255,.15)" stroke-width=".8"/>
      <line x1="4" y1="24" x2="18" y2="24" stroke="rgba(255,255,255,.15)" stroke-width=".8"/>
      <line x1="4" y1="35" x2="18" y2="35" stroke="rgba(255,255,255,.15)" stroke-width=".8"/>
    </g>

    <!-- Manga volume C (front, indigo/lavender — panel grid visible) -->
    <g transform="translate(63,90) rotate(5) translate(-10,-46)">
      <rect width="20" height="46" rx="2" fill="#e0e7ff"/>
      <rect width="4" height="46" rx="2" fill="#4338ca"/>
      <rect x="4" y="2" width="14" height="9" fill="#4338ca"/>
      <rect x="5" y="13" width="13" height="13" fill="none" stroke="#818cf8" stroke-width=".9"/>
      <rect x="5" y="28" width="6" height="9" fill="none" stroke="#818cf8" stroke-width=".9"/>
      <rect x="13" y="28" width="5" height="9" fill="none" stroke="#818cf8" stroke-width=".9"/>
      <rect x="5" y="39" width="13" height="4" fill="#c7d2fe" rx="1"/>
    </g>

    <rect x="8" y="8" width="94" height="94" rx="11" fill="none" stroke="rgba(255,255,255,.06)" stroke-width="1.5"/>
  </g>
  <rect x="1" y="1" width="108" height="108" rx="15" fill="none" stroke="rgba(99,102,241,.3)" stroke-width="1.5"/>

  <!-- Wordmark (light text — for dark backgrounds) -->
  <text x="126" y="65" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-weight="900" font-size="44" letter-spacing="-2" fill="#e0e7ff">MALAS</text>
  <text x="129" y="82" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-weight="500" font-size="10" letter-spacing="4.5" fill="#818cf8">MANGA LIBRARY</text>
</svg>
