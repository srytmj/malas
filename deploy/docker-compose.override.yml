# Override buat lokal/dev — otomatis ke-load kalau file ini ada di folder yang sama
# dengan docker-compose.yml (docker compose pakai override.yml secara default).
# Beda dengan docker-compose.yml (prod): source code di-bind-mount (bukan hasil build),
# APP_DEBUG diasumsikan true, ditambah service Vite buat HMR.
services:
  app:
    build:
      target: runtime
    volumes:
      - ..:/var/www/html
      - storage:/var/www/html/storage

  queue:
    volumes:
      - ..:/var/www/html
      - storage:/var/www/html/storage

  nginx:
    volumes:
      - ../public:/var/www/html/public

  vite:
    image: node:20-alpine
    working_dir: /var/www/html
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0"
    volumes:
      - ..:/var/www/html
    ports:
      - "5173:5173"
    env_file: .env
