version: '3.8'

services:
  app:
    build:
      context: ./docker/php
      dockerfile: Dockerfile
    container_name: malas_app
    volumes:
      - ./src:/var/www/html
    env_file:
      - .env.docker
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - malas_network

  webserver:
    image: nginx:alpine
    container_name: malas_webserver
    ports:
      - "80:80"
    volumes:
      - ./src:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - malas_network

  postgres:
    image: postgres:16
    container_name: malas_postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: malas
      POSTGRES_USER: malas
      POSTGRES_PASSWORD: secret
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - malas_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U malas"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: malas_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - malas_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  horizon:
    build:
      context: ./docker/php
      dockerfile: Dockerfile
    container_name: malas_horizon
    command: php artisan horizon
    volumes:
      - ./src:/var/www/html
    env_file:
      - .env.docker
    depends_on:
      app:
        condition: service_started
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - malas_network
    restart: unless-stopped

  queue:
    build:
      context: ./docker/php
      dockerfile: Dockerfile
    container_name: malas_queue
    command: php artisan queue:work --sleep=3 --tries=3 --max-time=3600
    volumes:
      - ./src:/var/www/html
    env_file:
      - .env.docker
    depends_on:
      app:
        condition: service_started
      redis:
        condition: service_healthy
    networks:
      - malas_network
    restart: unless-stopped

  # Opsional: Scheduler untuk menjalankan cron di dalam Docker
  scheduler:
    build:
      context: ./docker/php
      dockerfile: Dockerfile
    container_name: malas_scheduler
    command: php artisan schedule:work
    volumes:
      - ./src:/var/www/html
    env_file:
      - .env.docker
    depends_on:
      app:
        condition: service_started
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - malas_network
    restart: unless-stopped

networks:
  malas_network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local